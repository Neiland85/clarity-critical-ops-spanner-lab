status_values:
- PROPOSED
- IMPLEMENTED_UNVERIFIED
- VERIFIED_LOCAL
- VERIFIED_DISTRIBUTED
- VERIFIED_PREPRODUCTION
- DEPRECATED
- REVOKED

rules:
- id: RULE-001
  statement: A public technical statement must map to one claim identifier in this file.
- id: RULE-002
  statement: A claim may be described as implemented only when reviewable code or an authoritative contract exists.
- id: RULE-003
  statement: A claim may be described as verified only when its required validation gate has passed and preserved evidence is referenced.
- id: RULE-004
  statement: A local result must not be generalized to distributed, multi-process, regional, industrial or production behaviour.
- id: RULE-005
  statement: A claim must be downgraded or revoked when supporting evidence is invalidated or a material implementation change is not revalidated.
- id: RULE-006
  statement: Provider-specific validation applies only to the named adapter, topology, policy and configuration.
- id: RULE-007
  statement: Missing, failed, aborted or unexecuted evidence cannot support a verified claim.
- id: RULE-008
  statement: Raw credentials, personal data and lease tokens must not appear in claim evidence.
- id: RULE-009
  statement: Broad terms such as resilient, production-ready, immutable or exactly-once require a narrower validated scope.
- id: RULE-010
  statement: Claims concerning legal compliance, certification or contractual service levels require separate legal and operational assessment.

current_verified_boundary:
  status: VERIFIED_LOCAL
  validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  implementation: in-memory reference idempotency registry
  topology: single Python process
  concurrency_profile:
    submissions: 64
    worker_threads: 16
    observed_created: 1
    observed_pending: 63
  test_suite:
    collected: 75
    passed: 75
  verified_properties:
  - deterministic request hashing
  - idempotency identity isolation by scope and key
  - duplicate pending-request suppression
  - same-key conflicting-request detection
  - completed-response replay
  - terminal failed-state handling
  - pending leases
  - expiry and reacquisition
  - lease rotation
  - stale-worker fencing
  - expired-worker rejection
  - terminal-transition protection
  - deterministic local expiry
  - limited thread-based concurrency in one process
  not_verified:
  - multi-process convergence
  - distributed idempotency
  - durable registry behaviour
  - real Google Cloud Spanner behaviour
  - sustained industrial load
  - bounded admission under unique-key floods
  - load shedding and backpressure
  - provider-health hysteresis
  - message redelivery across independent workers
  - outbox delivery guarantees
  - failover and regional recovery
  - volumetric DDoS resistance
  - RF anti-jamming capability
  - universal end-to-end exactly-once execution
  - production readiness
  - regulatory certification or legal compliance

claims:
- id: CCO-LOCAL-001
  statement: The reference implementation computes deterministic request hashes for JSON-compatible payloads so object-key order does not change the hash.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process Python reference implementation using the current canonical JSON hashing function
  required_gate: V1
  scenarios:
  - IDEMP-001
  evidence:
  - app/tests/test_idempotency_registry.py::test_stable_request_hash_ignores_key_order
  - app/tests/test_idempotency_registry.py::test_stable_request_hash_changes_when_payload_changes
  - app/idempotency/registry.py
  limitations:
  - applies only to supported JSON-compatible values and the current canonicalization contract
  - does not prove compatibility with every external serializer or programming language
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-002
  statement: The reference registry isolates the same idempotency key across independent idempotency scopes.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry where idempotency_scope represents tenant identity
  required_gate: V1
  scenarios:
  - IDEMP-001
  evidence:
  - app/tests/test_idempotency_registry.py::test_same_key_is_isolated_between_idempotency_scopes
  - app/idempotency/registry.py
  limitations:
  - authentication-derived tenant binding is a target contract and is not verified by this local registry test
  - distributed tenant isolation is not verified
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-003
  statement: A duplicate pending request with the same scope, key, operation type and request hash does not receive a second execution lease in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry
  required_gate: V1
  scenarios:
  - IDEMP-001
  evidence:
  - app/tests/test_idempotency_registry.py::test_duplicate_pending_request_does_not_receive_execution_lease
  - app/idempotency/registry.py
  limitations:
  - does not establish multi-process or durable duplicate suppression
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-004
  statement: Reusing the same scope and idempotency key with a different request hash or operation type produces a conflict decision in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry
  required_gate: V1
  scenarios:
  - IDEMP-002
  evidence:
  - app/tests/test_idempotency_registry.py::test_same_key_different_payload_is_rejected
  - app/idempotency/registry.py
  limitations:
  - operation-type conflict behaviour is implemented in the same comparison branch but should receive a dedicated explicit test before being cited independently
  - distributed conflict convergence is not verified
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-005
  statement: A completed request is replayed from the stored response without reacquiring execution in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry
  required_gate: V1
  scenarios:
  - IDEMP-005
  evidence:
  - app/tests/test_idempotency_registry.py::test_completed_request_replays_original_response
  - app/tests/test_idempotency_registry.py::test_completed_operation_is_not_reacquired_after_ttl
  - app/idempotency/registry.py
  limitations:
  - response durability and replay across process or regional failure are not verified
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-006
  statement: A failed operation remains terminal and returns the stored failed decision in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: version-1 single-process in-memory registry semantics
  required_gate: V1
  scenarios:
  - IDEMP-005
  evidence:
  - app/tests/test_idempotency_registry.py::test_failed_request_returns_failed_decision
  - app/idempotency/registry.py
  limitations:
  - retryable and non-retryable failure taxonomy is not yet implemented as a general provider-neutral contract
  - FAILED is terminal in version 1
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-007
  statement: An expired pending operation can be reacquired with an incremented attempt and a rotated lease token in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry with an injected timezone-aware clock
  required_gate: V1
  scenarios:
  - IDEMP-003
  evidence:
  - app/tests/test_idempotency_registry.py::test_expired_pending_operation_is_reacquired_with_new_lease
  - app/tests/test_idempotency_registry.py::test_expire_pending_marks_due_operation_and_allows_reacquisition
  - app/idempotency/registry.py
  limitations:
  - distributed clock behaviour and durable lease ownership are not verified
  - lease duration is not a record-retention policy
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-008
  statement: A stale or expired lease holder cannot complete a newer or expired attempt in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry
  required_gate: V1
  scenarios:
  - IDEMP-004
  evidence:
  - app/tests/test_idempotency_registry.py::test_stale_worker_cannot_complete_reacquired_operation
  - app/tests/test_idempotency_registry.py::test_worker_cannot_complete_after_its_lease_expires
  - app/idempotency/registry.py
  limitations:
  - distributed fencing against external side effects is not verified
  - this claim covers registry terminal transitions, not every possible provider action
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-009
  statement: A completed terminal operation cannot be completed a second time in the reference registry.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_SCOPE
  scope: single-process in-memory registry
  required_gate: V1
  scenarios:
  - IDEMP-005
  evidence:
  - app/tests/test_idempotency_registry.py::test_terminal_operation_cannot_be_completed_twice
  - app/tests/test_idempotency_registry.py::test_completed_operation_is_not_reacquired_after_ttl
  - app/idempotency/registry.py
  limitations:
  - atomic coordination with a durable domain write and outbox is not yet verified
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

- id: CCO-LOCAL-010
  statement: Under a local test of 64 concurrent submissions using 16 threads, the reference registry produced one CREATED decision, 63 PENDING decisions and one authoritative record.
  status: VERIFIED_LOCAL
  public_use: PERMITTED_WITH_EXACT_PROFILE
  scope: one Python process, in-memory registry, 64 submissions and 16 worker threads
  required_gate: V1
  scenarios:
  - IDEMP-001
  evidence:
  - app/tests/test_idempotency_registry.py::test_concurrent_duplicates_create_single_pending_record
  limitations:
  - this is not a throughput benchmark
  - this does not verify sustained load, multi-process convergence, distributed locking or production capacity
  last_validation_date: '2026-07-11'
  repository_commit: 4e9723bb386bf65ec0651b9b4531c51f5fad5392
  owner: Clarity Structures Digital S.L.

