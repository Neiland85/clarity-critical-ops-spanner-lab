forbidden_statements:
- id: FORBIDDEN-001
  statement: Clarity Critical Operations is immune to volumetric DDoS attacks.
  reason: network and edge-capacity protection remain shared or external responsibilities and no such gate exists
- id: FORBIDDEN-002
  statement: Clarity Critical Operations provides RF anti-jamming capability.
  reason: RF interference controls are outside the execution-control product boundary
- id: FORBIDDEN-003
  statement: Clarity Critical Operations guarantees exactly-once execution end to end.
  reason: local idempotency semantics do not control every transport, provider and irreversible external effect
- id: FORBIDDEN-004
  statement: Clarity Critical Operations is production-ready.
  reason: no V6 controlled pre-production gate has passed and readiness is configuration-specific
- id: FORBIDDEN-005
  statement: Clarity Critical Operations is certified or legally compliant.
  reason: architectural documentation and tests are not legal certification or regulatory assessment
- id: FORBIDDEN-006
  statement: Clarity Critical Operations guarantees regional availability or a contractual SLA.
  reason: failover, recovery, availability targets and service levels have not been validated or contracted
- id: FORBIDDEN-007
  statement: The full system is immutable.
  reason: the defensible target is tamper-evident operational evidence and controlled state transitions, not universal immutability
- id: FORBIDDEN-008
  statement: Google Cloud Spanner integration is complete and verified.
  reason: Spanner is a target transactional adapter and no real adapter gate has passed
- id: FORBIDDEN-009
  statement: Admission control, provider-flapping containment and load shedding are already implemented.
  reason: these are proposed contracts and validation targets, not current verified runtime capabilities
- id: FORBIDDEN-010
  statement: Local thread-based tests prove industrial-scale or distributed resilience.
  reason: the current verified boundary is one process with a limited in-memory concurrency scenario

promotion_requirements:
  to_verified_local:
  - reviewable implementation exists
  - V1 scenario is versioned and passes
  - local environment is recorded
  - evidence references resolve
  - limitations remain explicit
  to_verified_distributed:
  - durable adapter and topology are identified
  - V2 passes without invariant breach
  - reconciliation succeeds
  - evidence bundle is preserved
  - claim scope names the validated adapter and topology
  to_verified_preproduction:
  - prerequisite lower gates remain valid
  - required V3 through V5 gates pass for the promoted capability
  - V6 authorized soak passes
  - rollback and runbook are exercised
  - evidence bundle and limitations are published internally

review:
  required_on_change:
  - execution semantics
  - request hashing or canonicalization
  - idempotency identity
  - lease or fencing behaviour
  - terminal-state policy
  - retention or purge policy
  - admission or capacity limits
  - provider-health policy
  - failover or recovery behaviour
  - evidence schema or reconciliation
  - public product wording
  downgrade_triggers:
  - supporting test fails
  - implementation changes materially without revalidation
  - evidence bundle is missing, corrupted or contradicted
  - a new incident disproves the statement
  - validated environment is no longer representative
  - contract semantics change incompatibly
