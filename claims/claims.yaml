  version: 1.0-draft
  status: PROPOSED
  date: '2026-07-11'
  product: Clarity Critical Operations
  technical_class: Provider-Neutral Critical Execution Control Plane
  owner: Clarity Structures Digital S.L.
  authority: authoritative repository index for public technical claims
  related:
  - docs/adr/ADR-0002-edge-idempotency-execution-contracts.md
  - docs/adr/ADR-0003-product-neutrality-and-background-ip-boundaries.md
  - docs/adr/ADR-0004-multi-vector-disruption-and-flapping-control.md
  - docs/security/THREAT-MODEL-0001-multi-vector-disruption-flapping-and-duplicate-execution.md
