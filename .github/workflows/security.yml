name: CI – Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            bandit==1.8.6 \
            pip-audit==2.10.1

      - name: Scan application code
        run: |
          python -m bandit -r app -ll

      - name: Record dependency vulnerability baseline
        id: dependency-audit
        continue-on-error: true
        run: |
          : > pip-audit-report.json
          python -m pip_audit \
            -r requirements.txt \
            --format=json \
            --output=pip-audit-report.json

      - name: Summarize dependency baseline
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("pip-audit-report.json")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          lines = [
              "## Python dependency baseline",
              "",
              "This audit is temporarily report-only while the inherited baseline is remediated.",
              "",
          ]

          try:
              data = json.loads(report_path.read_text())
              dependencies = (
                  data
                  if isinstance(data, list)
                  else data.get("dependencies", [])
              )
              vulnerabilities = [
                  vulnerability
                  for dependency in dependencies
                  for vulnerability in dependency.get("vulns", [])
              ]
              fixable = sum(
                  bool(vulnerability.get("fix_versions"))
                  for vulnerability in vulnerabilities
              )

              lines.extend(
                  [
                      f"- Audited dependencies: {len(dependencies)}",
                      f"- Reported vulnerabilities: {len(vulnerabilities)}",
                      f"- Findings with known fixes: {fixable}",
                  ]
              )
          except (OSError, json.JSONDecodeError) as exc:
              lines.extend(
                  [
                      "- Audit report could not be parsed.",
                      f"- Reason: `{exc}`",
                  ]
              )

          summary_path.write_text(
              summary_path.read_text() + "\n".join(lines) + "\n"
          )
          PY

      - name: Preserve dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-baseline
          path: pip-audit-report.json
          if-no-files-found: error
          retention-days: 30
