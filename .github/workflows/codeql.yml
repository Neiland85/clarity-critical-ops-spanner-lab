name: CodeQL Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-check:
    name: CodeQL capability
    if: ${{ (vars.ENABLE_CODEQL || 'false') != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Report CodeQL status
        shell: bash
        run: |
          {
            echo "## CodeQL analysis deferred"
            echo
            echo "GitHub Code Scanning is not currently enabled for this private repository."
            echo
            echo "The workflow remains prepared and can be activated by setting:"
            echo
            echo '`ENABLE_CODEQL=true`'
            echo
            echo "Current active security controls:"
            echo
            echo "- Trivy filesystem scanning"
            echo "- Bandit application scanning"
            echo "- Dependency security scanning"
            echo "- GitGuardian secret scanning"
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze (python)
    if: ${{ (vars['ENABLE_CODEQL'] || 'false') == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload-database: false
          output: sarif-results

      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-python-sarif
          path: sarif-results
          if-no-files-found: error
          retention-days: 30
