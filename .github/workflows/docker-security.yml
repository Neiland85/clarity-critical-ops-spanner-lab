name: Docker Security (Trivy)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          hide-progress: true
          exit-code: "0"

      - name: Publish Trivy report
        if: always()
        shell: bash
        run: |
          {
            echo "## Trivy security report"
            echo
            echo "<details><summary>CRITICAL and HIGH findings</summary>"
            echo
            echo '```text'
            if [[ -s trivy-results.txt ]]; then
              cat trivy-results.txt
            else
              echo "No CRITICAL or HIGH findings reported."
            fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: trivy-results.txt
          if-no-files-found: error
          retention-days: 30
