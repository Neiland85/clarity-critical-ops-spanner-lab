  - send a bounded, predeclared burst using one tenant, key and hash
  expected:
  - one authoritative record
  - bounded work amplification
  - explicit duplicate decisions
  invariants:
  - INV-001
  - INV-005
  - INV-006
  metrics:
  - submissions_received
  - submissions_admitted
  - pending_decisions
  - memory_use
- id: ADMIT-002
  version: '1.0'
  title: High-cardinality unique-key flood
  gate: V3
  layer: L3
  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  stimulus:
  - send predeclared unique keys above the tenant and global admission limits
  expected:
  - excess requests are rejected before expensive allocation
  - state growth remains bounded
  invariants:
  - INV-005
  - INV-007
  metrics:
  - new_keys_per_tenant
  - submissions_rejected
  - storage_growth
  - memory_use
- id: ADMIT-003
  version: '1.0'
  title: Noisy tenant
  gate: V3
  layer: L3
  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  stimulus:
  - one tenant consumes its configured admission budget while another sends normal traffic
  expected:
  - noisy tenant is constrained
  - reserved capacity for the other tenant remains available
  invariants:
  - INV-005
  - INV-007
  metrics:
  - rejections_by_tenant
  - admissions_by_tenant
  - queue_wait_time
- id: ADMIT-004
  version: '1.0'
  title: Global pending saturation
  gate: V3
  layer: L3
  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  stimulus:
  - hold admitted operations pending until the global ceiling is reached
  expected:
  - new work is rejected or shed using an explicit reason code
  - hard limit is not exceeded
  invariants:
  - INV-005
  - INV-006
  metrics:
  - global_pending_operations
  - active_leases
  - submissions_rejected
- id: ADMIT-005
  version: '1.0'
