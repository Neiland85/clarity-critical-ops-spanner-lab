  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  fault_profile:
  - seeded intermittent timeout
  expected:
  - timeouts consume retry budget
  - backoff and jitter are observable
  - no duplicate effect
  invariants:
  - INV-006
  - INV-009
