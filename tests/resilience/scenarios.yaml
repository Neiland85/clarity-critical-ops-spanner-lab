  gate: V3
  layer: L3
  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  stimulus:
  - submit payloads below, at and above the configured maximum
  expected:
  - oversized payload is rejected before durable allocation
  - boundary payload is handled deterministically
  invariants:
  - INV-005
  metrics:
  - payload_bytes
  - rejections_by_reason
  - authoritative_records_created
- id: ADMIT-006
  version: '1.0'
  title: Queue saturation
  gate: V3
  layer: L3
  implementation_status: PROPOSED
  validation_status: NOT_EXECUTED
  stimulus:
  - drive the bounded queue to its declared hard limit
  expected:
  - queue depth remains bounded
  - new work is rejected or shed
  - recovery occurs below threshold
  invariants:
  - INV-005
  - INV-006
  metrics:
  - queue_depth
  - queue_wait_time
  - shed_load
  - recovery_time
- id: PROV-001
